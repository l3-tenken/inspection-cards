<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- maximum-scale=1: iPhone の Safari が入力欄をタップしたときに自動で拡大し、横にはみ出したままになるのを防ぐ (指での拡大はできる) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>点検カード</title>
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="点検カード">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script>
  // 文字サイズ・外観は描画前に反映 (ちらつき防止)
  try { const s = localStorage.getItem('textSize'); if (s) document.documentElement.dataset.size = s; } catch {}
  // 外観。カスタム (custom-N) は保存しておいた CSS 変数を html に入れる (theme.js の themeVars と同じもの)
  try {
    const t = localStorage.getItem('theme'), h = document.documentElement, m = /^custom-(\d)$/.exec(t || '');
    const c = m && JSON.parse(localStorage.getItem('customThemes') || '[]')[m[1]];
    if (t && (!m || c)) h.dataset.theme = t;
    if (c) for (const [k, v] of Object.entries(c.vars)) h.style.setProperty(k, v);
  } catch {}
</script>
</head>
<body>
<header class="topbar">
  <h1 id="title">点検カード</h1>
  <span id="net" class="net"></span>
  <button id="size" class="btn ghost size-btn" aria-label="文字サイズ"></button>
  <div id="actions" class="actions"></div>
</header>
<main id="main"></main>
<script type="module" src="app.js"></script>
</body>
</html>
